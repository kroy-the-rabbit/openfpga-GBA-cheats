# SPDX-License-Identifier: GPL-3.0-or-later
# A release is a tag on main, and the package it names was built somewhere
# this workflow is not.
#
# Quartus runs only on controlled builders through the
# orchestrator's tools/runner-build, against a Quartus image that is private
# and stays so. The Quartus image is never uploaded to Actions or a registry.
# The simulation image contains Icarus Verilog, GHDL and Python, not Quartus.
# report.sh gates timing on the builder and exits 3 on negative slack.
#
# What CI does on a tag is check that the release the orchestrator published
# is the one the tag names: the package is present, its checksums verify, and
# the version stamped into core.json is the tag. A tag with no package, or a
# package stamped from another commit, fails here and says so. Nothing here
# synthesises, uploads or replaces a core.
#
# The ancestry check is what keeps this a release of main: `on: push: tags`
# has no branch filter and GitHub offers none, so a tag on a scratch branch
# would otherwise pass.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  RELEASE_BRANCH: main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the tag to be on the release branch
        run: |
          git fetch --no-tags origin "$RELEASE_BRANCH"
          if git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "$GITHUB_REF_NAME is on $RELEASE_BRANCH."
          else
            echo "::error::${GITHUB_REF_NAME} is not on ${RELEASE_BRANCH}." \
                 "Releases are built from that branch only; merge it first" \
                 "and tag the merge."
            exit 1
          fi

      - name: Install Podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends podman

      - name: Build the simulation image
        run: make sim-image

      - name: Simulation suite
        run: make test

      # The published package, checked rather than produced. `gh` reads the
      # release; nothing here writes one.
      - name: Verify the published package
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          zip="kroy.GBA_${version}.zip"
          mkdir -p dist && cd dist
          gh release download "$tag" -p "$zip" -p SHA256SUMS -p report.txt
          sha256sum -c SHA256SUMS
          unzip -p "$zip" Cores/kroy.GBA/core.json \
            | python3 -c "import json,sys; v=json.load(sys.stdin)['core']['metadata']['version']; print('stamped', v); sys.exit(v != '$version')"
          echo "$tag: package present, checksums verified, version stamped."
