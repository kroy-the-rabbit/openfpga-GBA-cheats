# SPDX-License-Identifier: GPL-3.0-or-later
# The complete simulation suite on pushes to main and pull requests.
# The public simulation image contains Icarus Verilog, GHDL and Python only.
# No Quartus runs here.
#
# tools/sim/run.py's corpus pass skips here. It diffs the RTL parser against
# the reference model over real .cht files, and that corpus is third-party
# content this repo does not carry; run it locally with
# `make test CHT_DB=/path/to/cht`. The converter's corpus cross-check is
# skipped for the same reason. Both say so rather than passing quietly.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  sim:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Calendar version checks
        run: bash tools/podman/test-version.sh

      - name: Install Podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends podman

      - name: Build the simulation image
        run: make sim-image

      - name: Simulation suite
        run: make test
